version: '3.9'

services:
    mariadb:
        image: mariadb:11.3
        container_name: mariadb
        restart: always
        environment:
            MARIADB_ROOT_PASSWORD: root
            MARIADB_DATABASE: devops_db
        ports:
            - '3307:3306'
        volumes:
            - mariadb_data:/var/lib/mysql

volumes:
    mariadb_data:
